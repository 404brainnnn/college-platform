services:
  - type: web
    name: college-platform-api
    env: node
    rootDir: backend
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:deploy && npm run db:seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: college-platform-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: college-platform-db
    plan: free
